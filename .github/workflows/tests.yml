name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The hooks run under whatever `python3` the user has, on Linux and macOS.
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the suite
        run: python -m pytest tests/ -q -rs | tee pytest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      # A green run that collected nothing, or silently skipped cases, proves nothing.
      - name: No empty run, no skips
        shell: bash
        run: python .github/check_pytest_output.py pytest.txt

  # The hooks run in Git Bash under the `python` that the installer writes into the commands (windows/README.md).
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # The report tests set TZ to a CET rule string. The Windows C runtime takes the offset from TZ but applies
      # daylight saving time only if the system time zone has it; the runner's is UTC, which has none. A system
      # zone with summer time, as on a desktop in Central Europe, makes TZ behave as the tests expect.
      - name: Give the runner a system time zone with daylight saving time
        run: tzutil /s "W. Europe Standard Time"

      # tests/test_soft_stop.py is left out until the soft stop is ported to Windows (checkpoint paths with
      # backslashes); the main suite and the Windows track (windows/cli/tests) run in full.
      - name: Run the suite and the Windows track
        run: python -m pytest tests/ windows/cli/tests/ --ignore=tests/test_soft_stop.py -q -rs | tee pytest.txt; exit ${PIPESTATUS[0]}
        shell: bash

      # No empty run, and no skips except the POSIX-only ones (tests marked posix_only, one fixed reason).
      - name: No empty run, no skips but POSIX-only
        shell: bash
        run: python .github/check_pytest_output.py pytest.txt --allow-posix-only-skips
